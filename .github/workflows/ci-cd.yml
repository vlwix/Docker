name: CI/CD Pipeline

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/docker-app

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build test image
        run: docker build --target test -t docker-app:test .

      - name: Run pytest in built image with Postgres
        run: docker compose run --rm test

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push prod image to GHCR
        if: github.event_name == 'push'
        run: |
          docker build --target runtime \
            -t ${{ env.IMAGE_NAME }}:latest \
            -t ${{ env.IMAGE_NAME }}:${{ github.sha }} .
          docker push ${{ env.IMAGE_NAME }}:latest
          docker push ${{ env.IMAGE_NAME }}:${{ github.sha }}

  deploy:
    needs: test
    runs-on: self-hosted
    if: github.event_name == 'push'

    steps:
      - name: Deploy on server (pull from GHCR)
        env:
          SSHPASS: ${{ secrets.SSH_PASSWORD }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
          IMAGE: ${{ env.IMAGE_NAME }}:latest
        run: |
          sshpass -e ssh -o StrictHostKeyChecking=no -p 58529 hoover@212.192.134.135 "
            echo '${GHCR_TOKEN}' | podman login ghcr.io -u '${GITHUB_ACTOR}' --password-stdin
            podman pull '${IMAGE}'
            podman stop app 2>/dev/null || true
            podman rm   app 2>/dev/null || true
            podman run -d --name app --network host \
              -e DATABASE_URL=postgresql+psycopg://kubsu:kubsu@127.0.0.1:5432/kubsu \
              '${IMAGE}'
          "
