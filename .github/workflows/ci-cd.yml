name: CI/CD Pipeline

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/docker-app

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build test image
        run: docker build --target test -t app:test .

      - name: Run tests in built image with PostgreSQL
        run: |
          docker network create testnet
          docker run -d --name db --network testnet \
            -e POSTGRES_DB=testdb \
            -e POSTGRES_USER=testuser \
            -e POSTGRES_PASSWORD=testpass \
            postgres:16-alpine
          until docker exec db pg_isready -U testuser; do sleep 1; done
          docker run --rm --network testnet \
            -e DATABASE_URL=postgresql+psycopg://testuser:testpass@db:5432/testdb \
            app:test

      - name: Cleanup
        if: always()
        run: |
          docker rm -f db || true
          docker network rm testnet || true

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push prod image to GHCR
        if: github.event_name == 'push'
        run: |
          docker build --target runtime \
            -t ${{ env.IMAGE }}:latest \
            -t ${{ env.IMAGE }}:${{ github.sha }} .
          docker push ${{ env.IMAGE }}:latest
          docker push ${{ env.IMAGE }}:${{ github.sha }}

  deploy:
    needs: test
    runs-on: self-hosted
    if: github.event_name == 'push'

    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull image from GHCR and save as tar
        run: |
          docker pull ${{ env.IMAGE }}:latest
          docker save ${{ env.IMAGE }}:latest | gzip > app.tar.gz

      - name: Copy image to server
        env:
          SSHPASS: ${{ secrets.SSH_PASSWORD }}
        run: |
          sshpass -e scp -o StrictHostKeyChecking=no -P 58529 \
            app.tar.gz hoover@212.192.134.135:~/app.tar.gz

      - name: Deploy on server with podman
        env:
          SSHPASS: ${{ secrets.SSH_PASSWORD }}
          IMAGE: ${{ env.IMAGE }}
        run: |
          sshpass -e ssh -o StrictHostKeyChecking=no -p 58529 hoover@212.192.134.135 "
            set -e
            gunzip -c ~/app.tar.gz | podman load
            podman stop app 2>/dev/null || true
            podman rm   app 2>/dev/null || true
            podman run -d --name app --network host \
              -e DATABASE_URL=postgresql+psycopg://kubsu:kubsu@127.0.0.1:5432/kubsu \
              ${IMAGE}:latest
          "

      - name: Cleanup
        if: always()
        run: rm -f app.tar.gz
