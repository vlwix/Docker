name: CI/CD

on:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build test image
        run: docker build --target test -t app:test .

      - name: Run tests in built image with PostgreSQL
        run: |
          docker network create testnet

          docker run -d --name db --network testnet \
            -e POSTGRES_DB=testdb \
            -e POSTGRES_USER=testuser \
            -e POSTGRES_PASSWORD=testpass \
            postgres:16-alpine

          until docker exec db pg_isready -U testuser; do sleep 1; done

          docker run --rm --network testnet \
            -e DATABASE_URL=postgresql+psycopg://testuser:testpass@db:5432/testdb \
            app:test

      - name: Cleanup
        if: always()
        run: |
          docker rm -f db || true
          docker network rm testnet || true

  deploy:
    needs: test
    runs-on: self-hosted

    steps:
      - uses: actions/checkout@v4

      - name: Build production image
        run: |
          docker build --target production -t localhost/app:latest .
          docker save localhost/app:latest | gzip > app.tar.gz

      - name: Copy app image to server
        env:
          SSHPASS: ${{ secrets.SSH_PASSWORD }}
        run: |
          sshpass -e scp -o StrictHostKeyChecking=no -P 58529 \
            app.tar.gz hoover@212.192.134.135:~/app.tar.gz

      - name: Deploy on server with podman
        env:
          SSHPASS: ${{ secrets.SSH_PASSWORD }}
        run: |
          sshpass -e ssh -o StrictHostKeyChecking=no -p 58529 hoover@212.192.134.135 '
            set -e
            gunzip -c ~/app.tar.gz | podman load
            podman stop app 2>/dev/null || true
            podman rm   app 2>/dev/null || true
            podman run -d --name app --network appnet \
              -p 8063:8063 \
              -e DATABASE_URL=postgresql+psycopg://kubsu:kubsu@db:5432/kubsu \
              localhost/app:latest
          '

      - name: Cleanup local files
        if: always()
        run: rm -f app.tar.gz
